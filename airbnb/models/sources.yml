version: 2

sources:
  - name: airbnbraw
    schema: raw
    tables:
      - name: listings
        identifier: raw_listings
      - name: hosts
        identifier: raw_hosts
      - name: reviews
        identifier: raw_reviews
        config:
          loaded_at_field: date
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
  - name: airbnbdev
    schema: dev
    tables:
      - name: hostlistings
        identifier: dim_listings_with_hosts
      - name: fctreviews
        identifier: fct_reviews
      - name: fullmoon
        identifier: seed_full_moon_dates
      - name: hosts
        identifier: dim_hosts_cleansed
      - name: listings
        identifier: dim_listings_cleansed
